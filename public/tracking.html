<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>📦 Seguimiento</h1><a href="/">Pizzería</a></header><main><section class="card"><h2 id="title"></h2><div id="status"></div><p id="detail"></p></section></main><script>
const id=new URLSearchParams(location.search).get("id");const labels={new:"Pedido recibido",accepted:"Pedido aceptado",preparing:"En preparación",ready:"Listo para recoger",delivery_requested:"Buscando repartidor",courier_assigned:"Repartidor asignado",out_for_delivery:"En camino",delivered:"Entregado",cancelled:"Cancelado"};async function load(){const r=await fetch("/api/orders/"+id+"/public");const o=await r.json();if(!r.ok)return document.querySelector("#status").textContent=o.error;document.querySelector("#title").textContent="Pedido #"+o.id;document.querySelector("#status").innerHTML="<h2>"+(labels[o.status]||o.status)+"</h2><progress max='100' value='"+Math.min(100,["new","accepted","preparing","ready","delivery_requested","courier_assigned","out_for_delivery","delivered"].indexOf(o.status)*14.3)+"'></progress>";document.querySelector("#detail").textContent="Total "+(o.total_cents/100).toFixed(2)+" €";}load();setInterval(load,5000);
</script></body></html>
